<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple product review form where users can rate a product and leave feedback.">
    <meta name="author" content="Kyle Danielle Santiago">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js"></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get" id="reviewForm">
            <div class="field">
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <div class="field">
                <label>Overall Rating</label>
                <div class="rating-group">
                    <div class="rating-item">
                        <span>☆</span>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                    </div>
                    <div class="rating-item">
                        <span>☆☆</span>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                    </div>
                    <div class="rating-item">
                        <span>☆☆☆</span>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                    </div>
                    <div class="rating-item">
                        <span>☆☆☆☆</span>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                    </div>
                    <div class="rating-item">
                        <span>☆☆☆☆☆</span>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                    </div>
                </div>
            </div>

            <div class="field">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <div class="field">
                <label>Which features did you find useful in the product? (Check all that apply)</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="features" value="durability"> Durability</label>
                    <label><input type="checkbox" name="features" value="ease"> Ease of Use</label>
                    <label><input type="checkbox" name="features" value="performance"> Performance</label>
                    <label><input type="checkbox" name="features" value="design"> Design</label>
                </div>
            </div>

            <div class="field">
                <label for="review">Written Review (Optional)</label>
                <textarea id="review" name="review" rows="4"></textarea>
            </div>

            <div class="field">
                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName" name="userName">
            </div>

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Kyle Danielle Santiago 🌸 Philippines</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
